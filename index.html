<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Тартиль — правила таджвида по шагам: уроки, примеры из аятов с озвучкой и тесты.">
<title>Тартиль</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;600&family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: one narrow reading column, like a mushaf page; lessons are a numbered path, colors follow tajweed-mushaf conventions */
:root{
  --paper:#f4f7f4; --card:#ffffff; --ink:#15211c; --muted:#5a6a62; --line:#dde5df;
  --accent:#0d6655; --accent-soft:#e1efe9; --on-accent:#ffffff; --tip:#fbf3e2; --tip-line:#ecd6a8;
  --t-madd:#c23a2e; --t-ghunna:#1d8a49; --t-qalqala:#0f8aa6; --t-heavy:#2c46b0; --t-izhar:#a86b10; --t-silent:#8b9690;
  --good:#1d8a49; --bad:#c23a2e;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Scheherazade New","Amiri","Geeza Pro","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1613; --card:#17201c; --ink:#e6eee9; --muted:#9aaca3; --line:#26332d;
  --accent:#4cc1a6; --accent-soft:#183a31; --on-accent:#08201a; --tip:#2a2416; --tip-line:#4a3e22;
  --t-madd:#f07a6c; --t-ghunna:#5bd08a; --t-qalqala:#4fc9e3; --t-heavy:#8ea2ff; --t-izhar:#e0a94a; --t-silent:#7f8c86;
  --good:#5bd08a; --bad:#f07a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1613; --card:#17201c; --ink:#e6eee9; --muted:#9aaca3; --line:#26332d;
  --accent:#4cc1a6; --accent-soft:#183a31; --on-accent:#08201a; --tip:#2a2416; --tip-line:#4a3e22;
  --t-madd:#f07a6c; --t-ghunna:#5bd08a; --t-qalqala:#4fc9e3; --t-heavy:#8ea2ff; --t-izhar:#e0a94a; --t-silent:#7f8c86;
  --good:#5bd08a; --bad:#f07a6c; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 64px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:8px 18px}
.brand h1{font-size:30px;letter-spacing:-.01em}
.brand .ar{font-size:26px;color:var(--accent)}
.lead{color:var(--muted);margin:0 0 18px;max-width:60ch}
.overall{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.overall .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;
  background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none;text-align:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:18px 0 4px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.section-h{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:28px 0 10px;font-family:var(--f-body)}
.section-h span{font-variant-numeric:tabular-nums;letter-spacing:0}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--accent)}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;font-size:16px}
.item .t .ar{display:block;font-size:20px;color:var(--muted);text-align:left;line-height:1.7}
.ring{position:relative;width:48px;height:48px}
.ring svg{width:48px;height:48px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);font-size:20px}
.done-tag{font-size:12px;color:var(--good);font-weight:600;font-variant-numeric:tabular-nums}
.review{margin-top:28px;background:var(--accent-soft);border-radius:16px;padding:18px;display:grid;gap:10px}
.review h2{font-size:20px}
.review p{margin:0;color:var(--muted)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:20px}
.topbar .mid{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.topbar .btn{padding:8px 14px}
.back{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.lesson-head{text-align:center;display:grid;gap:4px;margin-bottom:18px}
.lesson-head .ar{font-size:36px;line-height:1.7;color:var(--accent)}
.lesson-head h2{font-size:26px}
.lesson-head .num{font-size:12px;color:var(--muted);letter-spacing:.08em}
.prose p{margin:0 0 12px;max-width:65ch}
.short{border-left:4px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;margin:0 0 18px;font-size:16px}
.short b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0 18px}
.sign{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sign .ar{display:block;font-size:34px;line-height:1.6}
.sign small{color:var(--muted)}
.rules{display:grid;gap:8px;margin:6px 0 18px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.rule h4{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rule h4 small{font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.rule .letters{font-size:24px;line-height:1.6;letter-spacing:.1em}
.rule p{margin:0;color:var(--muted);font-size:15px}
.letterset{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;margin:4px 0 18px}
.letterset span{font-family:var(--f-ar);font-size:26px;line-height:1;min-width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.tip{background:var(--tip);border:1px solid var(--tip-line);border-radius:12px;padding:12px 14px;margin:6px 0 16px;font-size:15px}
.tip b{display:block;margin-bottom:2px}
h3.sub{font-size:18px;margin:22px 0 10px}
.examples{display:grid;gap:8px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:2px;text-align:center}
.ex .ar{font-size:32px;line-height:1.9}
.ex .note{font-size:14px;color:var(--muted)}
.ex .src{font-size:12px;color:var(--muted);opacity:.8}
mark{background:none;color:var(--hl,var(--t-madd))}
mark.madd{--hl:var(--t-madd)} mark.ghunna{--hl:var(--t-ghunna)} mark.qalqala{--hl:var(--t-qalqala)} mark.heavy{--hl:var(--t-heavy)} mark.izhar{--hl:var(--t-izhar)} mark.silent{--hl:var(--t-silent)}
.play{justify-self:center;margin-top:6px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:6px 14px 6px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.play .ic{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:10px}
.play.on{border-color:var(--accent)}
.play:hover{border-color:var(--accent)}
.ctx{font-size:22px;line-height:2;color:var(--muted);margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.frag{color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:0 4px}
.full{font-size:13px;color:var(--muted);text-align:center}
.full summary{cursor:pointer;color:var(--accent);font-weight:600;list-style-position:inside}
.full .ar{font-size:22px;line-height:2;color:var(--ink);margin-top:6px}
.plays{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.plays .play{margin-top:0}
.play.ghost{background:transparent}
.credit{font-size:13px;color:var(--muted);margin:10px 0 0}
.lesson-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.lesson-foot .btn{flex:1 1 200px}

.q-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:8px}
.q-from{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:14px}
.q-text{font-size:20px;font-family:var(--f-display);margin:6px 0}
.q-ar{font-size:36px;text-align:center;line-height:1.9;margin:4px 0}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ar{font-size:26px}
.opt.ok{border-color:var(--good);color:var(--good);font-weight:600}
.opt.no{border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:15px}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding-top:20px}
.result .big{font-family:var(--f-display);font-size:56px;font-variant-numeric:tabular-nums;color:var(--accent)}
.ar-in{font-family:var(--f-ar);font-size:1.3em;line-height:1;font-weight:400;unicode-bidi:isolate}
.ar .ar-in,.letterset .ar-in{font-size:inherit;line-height:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* c: color class — madd | ghunna | qalqala | heavy | izhar (ясно/мягко) | silent */
const LESSONS = [
/* ───────── ОСНОВЫ ───────── */
{id:"istiaza",short:"Сначала «а‘ӯзу билляхи…», потом «бисмилляхи…». Басмалу не читают только перед сурой «ат-Тауба».",sec:"Основы чтения",title:"Начало чтения",ar:"ٱلِٱسْتِعَاذَةُ وَٱلْبَسْمَلَةُ",
 body:["Перед чтением Куръана читают истиазу — просьбу к Аллаху о защите от шайтана. Это сунна при любом начале чтения, с начала суры или с середины.","Затем читают басмалу. В начале каждой суры её читают всегда, кроме суры «ат-Тауба» (9-я сура). Если чтение начинают с середины суры, басмалу говорить не обязательно, но лучше сказать."],
 tip:{h:"Между сурами",t:"Читая подряд две суры, между ними произносят басмалу. Перед «ат-Тауба» басмалу не читают, даже если до неё читали суру «аль-Анфаль»."},
 examples:[{ar:"أَعُوذُ بِٱللَّهِ مِنَ ٱلشَّيْطَٰنِ ٱلرَّجِيمِ",note:"Истиаза: а‘ӯзу билля̄хи минаш-шайта̄нир-раджӣм"},{ar:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",note:"Басмала: бисмилля̄хир-рахма̄нир-рахӣм"}],
 quiz:[{q:"Что читают в самом начале чтения Куръана?",o:["Басмалу","Истиазу","Суру «аль-Фатиха»"],a:1,e:"Сначала истиаза, затем басмала."},
  {q:"Перед какой сурой басмалу не читают?",o:["аль-Фатиха","аль-Бакара","ат-Тауба","ан-Нас"],a:2,e:"Сура «ат-Тауба» — единственная, перед которой басмалу не читают."},
  {q:"Вы начинаете чтение с середины суры. Басмала…",o:["обязательна","не обязательна, но лучше сказать","запрещена"],a:1,e:"В середине суры басмала желательна, но не обязательна."},
  {q:"Читаете подряд две суры. Что между ними?",o:["Басмала","Истиаза","Ничего"],a:0,e:"Между сурами читают басмалу (кроме перехода к «ат-Тауба»)."}]},

{id:"harakat",short:"Фатха — [а], кясра — [и], домма — [у], сукун — гласной нет.",sec:"Основы чтения",title:"Огласовки и сукун",ar:"ٱلْحَرَكَاتُ وَٱلسُّكُونُ",
 body:["Краткие гласные в арабском письме не пишутся отдельными буквами. Их обозначают знаками над буквой и под ней — харакатами.","С твёрдыми буквами (خ ص ض غ ط ق ظ) звук становится глубже: фатха звучит ближе к [о], кясра — ближе к [ы].","Если у буквы нет гласной, над ней ставят маленький кружок — сукун. Такая буква читается закрыто, без гласного звука."],
 signs:[{ar:"بَ",name:"Фатха",s:"черточка над буквой — [а]"},{ar:"بِ",name:"Кясра",s:"черточка под буквой — [и]"},{ar:"بُ",name:"Домма",s:"«запятая» над буквой — [у]"},{ar:"بْ",name:"Сукун",s:"кружок — нет гласной"}],
 tip:{h:"Знак сукуна в разных изданиях",t:"В мединском мусхафе сукун пишут не кружком, а маленькой головкой буквы ха без точки. В других изданиях его рисуют иначе, но смысл один: у буквы нет гласной."},
 examples:[{ar:"كَتَبَ",note:"катаба — три фатхи"},{ar:"خَلَقَ",hl:"خَ",c:"heavy",note:"холяка — фатха с твёрдой буквой ближе к [о]"},{ar:"بِهِ",note:"бихи — кясры"},{ar:"هُوَ",note:"хува — домма и фатха"},{ar:"قُلْ",hl:"لْ",c:"izhar",note:"куль — лям с сукуном"},{ar:"يُشْهِدُ",hl:"شْ",c:"izhar",note:"юшхиду — шин с сукуном"}],
 quiz:[{q:"Какой знак обозначает звук [и]?",o:["Фатха","Кясра","Домма","Сукун"],a:1,e:"Кясра — черточка под буквой."},
  {q:"Что означает маленький кружок над буквой?",o:["Удвоение буквы","Отсутствие гласной","Долгий звук","Звук через нос"],a:1,e:"Это сукун: буква без гласной."},
  {q:"Как читается это слово?",ar:"قُتِلَ",o:["катала","кутиля","китуля","кутуль"],a:1,e:"Домма, кясра, фатха: ку-ти-ля."},
  {q:"Как выглядит домма?",o:["Черточка над буквой","Черточка под буквой","Маленькая «запятая» над буквой","Кружок над буквой"],a:2,e:"Домма похожа на маленькую запятую над буквой."}]},

{id:"tashdid",short:"Знак ташдида удваивает согласную: رَبَّ = «раб-ба».",sec:"Основы чтения",title:"Ташдид",ar:"ٱلتَّشْدِيدُ",
 body:["Ташдид (шадда) — знак, похожий на маленькую «ш» над буквой. Он удваивает согласную.","Удвоенную букву раскладывают так: сначала та же буква с сукуном, затем она же с огласовкой, которая стоит при ташдиде. Произносят слитно, одним звуком, но дольше и напряжённее."],
 signs:[{ar:"بَّ",name:"Ташдид + фатха",s:"[бба]"},{ar:"بِّ",name:"Ташдид + кясра",s:"[бби]"},{ar:"بُّ",name:"Ташдид + домма",s:"[ббу]"}],
 examples:[{ar:"رَبَّ",hl:"بَّ",c:"madd",note:"раб-ба = رَبْ + بَ"},{ar:"عَلَّمَ",hl:"لَّ",c:"madd",note:"‘ал-лама"},{ar:"فَكَّرَ",hl:"كَّ",c:"madd",note:"фак-кара"},{ar:"سَبَّحَ",hl:"بَّ",c:"madd",note:"саб-баха"},{ar:"قَدَّرَ",hl:"دَّ",c:"madd",note:"кад-дара"},{ar:"أُحِبُّ",hl:"بُّ",c:"madd",note:"ухиб-бу"}],
 quiz:[{q:"Что делает ташдид?",o:["Удлиняет гласную","Удваивает согласную","Делает букву немой","Обозначает паузу"],a:1,e:"Ташдид удваивает согласную."},
  {q:"Как читается это слово?",ar:"جَدُّ",o:["джаду","джадду","джадда","джад"],a:1,e:"جَدْ + دُ = джадду."},
  {q:"Буква с ташдидом — это…",o:["буква с сукуном + та же буква с огласовкой","две разные буквы","долгая гласная"],a:0,e:"Первая половина с сукуном, вторая с огласовкой."}]},

{id:"tanwin",short:"Двойная огласовка в конце слова = огласовка + [н]: «-ун», «-ан», «-ин».",sec:"Основы чтения",title:"Танвин",ar:"ٱلتَّنْوِينُ",
 body:["Танвин — сдвоенная огласовка в конце слова. Он читается как огласовка плюс звук [н] с сукуном, хотя буква нун не пишется.","Танвин звучит как нун с сукуном, поэтому к нему применяются все правила нуна с сукуном: изхар, идгам, икляб и ихфа.","При остановке на танвине с фатхой читают долгое [а] на две огласовки — это мад ‘иваз. На танвине с доммой и кясрой при остановке просто ставят сукун."],
 signs:[{ar:"بٌ",name:"Двойная домма",s:"[бун]"},{ar:"بًا",name:"Двойная фатха",s:"[бан]"},{ar:"بٍ",name:"Двойная кясра",s:"[бин]"}],
 tip:{h:"Та марбута",t:"Если танвин стоит на та марбута (ة), при остановке читают звук [h]: رَحْمَةً → «рахмах», а не «рахма̄»."},

  {q:"Какие правила применяются к танвину?",o:["Правила нуна с сукуном","Правила мима с сукуном","Никаких"],a:0,e:"Танвин звучит как нун с сукуном."},
  {q:"Как прочитать كِتَابًا при остановке?",o:["китабан","кита̄ба̄ — с долгим [а]","китаб","китабун"],a:1,e:"Танвин с фатхой при остановке превращается в долгое [а]."},
  {q:"Как остановиться на слове رَحْمَةً?",o:["рахма̄","рахмах","рахматан"],a:1,e:"На та марбута при остановке читают [h]."}]},

{id:"madd",short:"Буквы ا و ي после подходящей огласовки тянут на 2 счёта.",sec:"Основы чтения",title:"Естественное удлинение",ar:"ٱلْمَدُّ ٱلطَّبِيعِيُّ",
 body:["Мад — удлинение гласного звука. Естественный мад (мад табии) длится две огласовки, то есть вдвое дольше обычного гласного.","Удлиняют три буквы: алиф после фатхи, вав с сукуном после доммы и йа с сукуном после кясры. Без этих букв слово меняет смысл, поэтому сокращать мад нельзя."],
 signs:[{ar:"بَا",name:"Алиф",s:"[ба̄]"},{ar:"بُو",name:"Вав",s:"[бӯ]"},{ar:"بِي",name:"Йа",s:"[бӣ]"}],
 tip:{h:"Маленькие буквы мада",t:"В мусхафе часто пишут маленький алиф над буквой (ٱلرَّحْمَٰنِ), маленький вав после ха (إِنَّهُۥ) или маленький йа (بِهِۦ). Они тоже удлиняют звук на две огласовки."},
 examples:[{ar:"قَالَ",hl:"قَا",c:"madd",note:"ка̄ля"},{ar:"يَقُولُ",hl:"قُو",c:"madd",note:"якӯлю"},{ar:"قِيلَ",hl:"قِي",c:"madd",note:"кӣля"},{ar:"نُوحِيهَا",hl:"نُو",c:"madd",note:"нӯхӣха̄ — три мада подряд"},{ar:"ٱلرَّحْمَٰنِ",hl:"مَٰ",c:"madd",note:"ар-рахма̄ни — маленький алиф"}],
 quiz:[{q:"Сколько длится естественный мад?",o:["1 огласовку","2 огласовки","4 огласовки","6 огласовок"],a:1,e:"Мад табии — две огласовки."},
  {q:"Какая буква удлиняет звук после доммы?",o:["ا","و","ي","ن"],ar_opts:true,a:1,e:"После доммы удлиняет вав с сукуном."},
  {q:"В каком слове мад после кясры?",o:["قَالَ","يَقُولُ","قِيلَ","قُلْ"],ar_opts:true,a:2,e:"قِيلَ — кясра и йа с сукуном."}]},

{id:"hamza",short:"Хамза أ читается всегда. Хамза ٱ — только если с этого слова начинаете чтение.",sec:"Основы чтения",title:"Хамза: кат‘ и васль",ar:"هَمْزَةُ ٱلْقَطْعِ وَٱلْوَصْلِ",
 body:["Хамза — короткая смычка в горле, как пауза в русском «не-а». Хамза кат‘ (أ إ ء) читается всегда: в начале, середине и конце слова.","Хамза васль (ٱ) читается только тогда, когда с этого слова начинают чтение. Если слово читается слитно с предыдущим, она пропадает, и звук переходит прямо на следующую букву."],
 rules:[{n:"Артикль ٱلْ",l:"ٱلْ",d:"Начинают с фатхой: ٱلْحَمْدُ → «аль-хамду»."},{n:"Глагол, третья буква с доммой",l:"ٱنظُرُوا۟",d:"Начинают с доммой: «унзурӯ»."},{n:"Глагол, третья буква с фатхой или кясрой",l:"ٱذْهَبْ",d:"Начинают с кясрой: «изхаб»."},{n:"Существительные без артикля",l:"ٱسْمُ · ٱبْنُ · ٱمْرَأَتُ",d:"Начинают с кясрой: «исму», «ибну», «имра’ату»."}],
 examples:[{ar:"أَنْعَمْتَ",hl:"أَ",c:"izhar",note:"ан‘амта — хамза кат‘, читается"},{ar:"سَأَلَ",hl:"أَ",c:"izhar",note:"са’аля — хамза в середине"},{ar:"نَسْتَعِينُ ٱهْدِنَا",hl:"ٱ",c:"silent",note:"наста‘ӣнух-дина̄ — в слитном чтении хамза пропадает"},{ar:"ٱهْدِنَا",hl:"ٱ",c:"izhar",note:"ихдина̄ — так начинают с этого слова"},{ar:"ٱنظُرُوا۟",hl:"ٱ",c:"izhar",note:"унзурӯ — третья буква с доммой"}],
 quiz:[{q:"Какая хамза читается всегда?",o:["Хамза кат‘ (أ)","Хамза васль (ٱ)","Обе пропадают в слитном чтении"],a:0,e:"Хамза кат‘ не пропадает никогда."},
  {q:"Как начать чтение со слова ٱذْهَبْ?",o:["узхаб","изхаб","азхаб"],a:1,e:"Третья буква с фатхой — начинают с кясрой."},
  {q:"Как начать чтение со слова ٱنظُرُوا۟?",o:["унзурӯ","инзурӯ","анзурӯ"],a:0,e:"Третья буква с доммой — начинают с доммой."},
  {q:"С какой огласовкой начинают артикль ٱلْ?",o:["Фатха","Кясра","Домма"],a:0,e:"Артикль всегда начинают с фатхой: «аль-…»."}]},

{id:"tafkhim",short:"Семь букв خ ص ض غ ط ق ظ всегда звучат «полно» и глубоко, остальные — легко.",sec:"Твёрдость и мягкость",title:"Твёрдые и мягкие буквы",ar:"ٱلتَّفْخِيمُ وَٱلتَّرْقِيقُ",
 body:["Семь букв всегда читаются твёрдо (тафхим): задняя часть языка поднимается к нёбу, звук становится «полным». Их собирают во фразе «خُصَّ ضَغْطٍ قِظْ».","Большинство остальных букв всегда мягкие (таркик). Три буквы меняются по правилам: ра, лям в слове «Аллах» и алиф. Алиф повторяет твёрдость буквы перед ним."],
 sets:[{h:"Всегда твёрдые (7)",l:"خ ص ض غ ط ق ظ"}],
 signs:[{ar:"سَ · صَ",name:"син · сад",s:"мягкая · твёрдая"},{ar:"تَ · طَ",name:"та · то",s:"мягкая · твёрдая"},{ar:"ذَ · ظَ",name:"заль · зо",s:"мягкая · твёрдая"},{ar:"كَ · قَ",name:"каф · коф",s:"мягкая · твёрдая"}],
 tip:{h:"Частая ошибка",t:"Не делайте мягкими буквы рядом с твёрдыми: в слове ٱلصِّرَٰطَ мягкая только кясра, сама буква сад остаётся твёрдой."},
 examples:[{ar:"قَالَ",hl:"قَا",c:"heavy",note:"ко̄ля — алиф твёрдый после коф"},{ar:"كَانَ",hl:"كَا",c:"izhar",note:"ка̄на — алиф мягкий после каф"},{ar:"ٱلصِّرَٰطَ",hl:"صِّ",c:"heavy",note:"ас-сыра̄то — сад твёрдая"},{ar:"ٱلطَّارِقُ",hl:"طَّا",c:"heavy",note:"ат-то̄рику"},{ar:"وَلَا ٱلضَّآلِّينَ",hl:"ضَّ",c:"heavy",note:"валяд-до̄ллӣн"}],
 quiz:[{q:"Сколько букв читаются твёрдо всегда?",o:["5","7","14","3"],a:1,e:"خ ص ض غ ط ق ظ — семь букв."},
  {q:"Какая из букв твёрдая?",o:["ت","ط","د","ك"],ar_opts:true,a:1,e:"Та (ط) — твёрдая пара мягкой ت."},
  {q:"Как читается алиф в слове قَالَ?",o:["Твёрдо — после коф","Мягко — алиф всегда мягкий","Не читается"],a:0,e:"Алиф следует за твёрдостью предыдущей буквы."}]},

{id:"allah",short:"После [а] и [у] — «Аллох» твёрдо, после [и] — «Алля̄х» мягко.",sec:"Твёрдость и мягкость",title:"Лям в слове «Аллах»",ar:"لَامُ لَفْظِ ٱلْجَلَالَةِ",
 body:["Лям в слове «Аллах» читается твёрдо, если перед ним фатха или домма, а также когда с этого слова начинают чтение.","Если перед ним кясра, лям читается мягко. Кясра может стоять и на конце предыдущего слова."],
 rules:[{n:"Твёрдо",l:"ـَ ٱللَّه · ـُ ٱللَّه",d:"После фатхи или доммы и в начале чтения."},{n:"Мягко",l:"ـِ ٱللَّه",d:"После кясры, в том числе временной."}],
 examples:[{ar:"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ",hl:"لَّ",c:"heavy",note:"Аллоху — в начале чтения твёрдо"},{ar:"قَالَ ٱللَّهُ",hl:"لَّ",c:"heavy",note:"ка̄лаллоху — после фатхи"},{ar:"عَبْدُ ٱللَّهِ",hl:"لَّ",c:"heavy",note:"‘абдуллохи — после доммы"},{ar:"بِسْمِ ٱللَّهِ",hl:"لَّ",c:"izhar",note:"бисмилля̄хи — после кясры мягко"},{ar:"قُلِ ٱللَّهُمَّ",hl:"لَّ",c:"izhar",note:"кулилля̄хумма — кясра на конце «куль»"}],
 quiz:[{q:"Как читается лям в бисмилля̄хи?",o:["Мягко","Твёрдо"],a:0,e:"Перед ним кясра."},
  {q:"Как читается лям в عَبْدُ ٱللَّهِ?",o:["Мягко","Твёрдо"],a:1,e:"Перед ним домма — твёрдо."},
  {q:"Вы начинаете чтение со слова ٱللَّهُ. Лям…",o:["Мягкий","Твёрдый"],a:1,e:"В начале чтения слово «Аллах» начинают с фатхой, лям твёрдый."}]},

{id:"ra",short:"Ра с [а] или [у] — твёрдая, с [и] — мягкая. С сукуном смотрим на букву перед ней.",sec:"Твёрдость и мягкость",title:"Буква «Ра»",ar:"أَحْكَامُ ٱلرَّاءِ",
 body:["Ра читается то твёрдо, то мягко. Смотрят на её огласовку, а если у неё сукун — на огласовку буквы перед ней."],
 rules:[{n:"Твёрдо",l:"رَ · رُ",d:"Ра с фатхой или доммой."},{n:"Твёрдо",l:"ـَرْ · ـُرْ",d:"Ра с сукуном после фатхи или доммы."},{n:"Твёрдо",l:"ٱرْ",d:"Ра с сукуном после кясры хамзы васль: ٱرْجِعِىٓ."},{n:"Твёрдо",l:"قِرْطَاس",d:"Ра с сукуном после кясры, если дальше в том же слове твёрдая буква."},{n:"Мягко",l:"رِ",d:"Ра с кясрой."},{n:"Мягко",l:"فِرْعَوْن",d:"Ра с сукуном после постоянной кясры в том же слове."},{n:"Мягко при остановке",l:"خَيْرْ · ذِكْرْ",d:"Перед ра йа с сукуном или буква с сукуном после кясры."}],
 examples:[{ar:"رَبِّ",hl:"رَ",c:"heavy",note:"робби — ра с фатхой"},{ar:"رُسُلُ",hl:"رُ",c:"heavy",note:"русулю — ра с доммой"},{ar:"ٱلْقُرْءَانُ",hl:"رْ",c:"heavy",note:"аль-кур’а̄н — сукун после доммы"},{ar:"ٱرْجِعِىٓ",hl:"رْ",c:"heavy",note:"ирджи‘ӣ — кясра от хамзы васль"},{ar:"مِرْصَادًا",hl:"رْ",c:"heavy",note:"мирсо̄да̄ — дальше твёрдая сад"},{ar:"رِجَالٌ",hl:"رِ",c:"izhar",note:"риджа̄лун — ра с кясрой"},{ar:"فِرْعَوْنَ",hl:"رْ",c:"izhar",note:"фир‘ауна — мягко после кясры"},{ar:"خَيْرٌ",hl:"رٌ",c:"izhar",note:"при остановке «хайр» — мягко после йа"}],
 quiz:[{q:"Как читается ра в слове رَبِّ?",o:["Твёрдо","Мягко"],a:0,e:"Ра с фатхой — твёрдо."},
  {q:"Как читается ра в слове فِرْعَوْنَ?",o:["Твёрдо","Мягко"],a:1,e:"Сукун после постоянной кясры — мягко."},
  {q:"Почему ра в ٱرْجِعِىٓ твёрдая, хотя перед ней кясра?",o:["Кясра принадлежит хамзе васль","Дальше твёрдая буква","Ра всегда твёрдая"],a:0,e:"Кясра хамзы васль временная, она не смягчает ра."},
  {q:"Как читается ра в слове رِجَالٌ?",o:["Твёрдо","Мягко"],a:1,e:"Ра с кясрой — мягко."}]},

{id:"shams",short:"Перед 14 солнечными буквами лям артикля не читается: «аш-шамс». Перед лунными читается: «аль-камар».",sec:"Артикль и звуки",title:"Солнечные и лунные буквы",ar:"ٱلْحُرُوفُ ٱلشَّمْسِيَّةُ وَٱلْقَمَرِيَّةُ",
 body:["Артикль ٱلْ перед солнечной буквой не читается: лям сливается со следующей буквой, а на ней появляется ташдид.","Перед лунной буквой лям читается ясно, с сукуном. Лунные буквы запоминают по фразе «ٱبْغِ حَجَّكَ وَخَفْ عَقِيمَهُ»."],
 sets:[{h:"Солнечные (14)",l:"ت ث د ذ ر ز س ش ص ض ط ظ ل ن"},{h:"Лунные (14)",l:"ا ب ج ح خ ع غ ف ق ك م و ه ي"}],
 examples:[{ar:"ٱلشَّمْسُ",hl:"ٱل",c:"silent",note:"аш-шамсу — лям не читается"},{ar:"ٱلنَّاسِ",hl:"ٱل",c:"silent",note:"ан-на̄си"},{ar:"ٱلتَّوَّابُ",hl:"ٱل",c:"silent",note:"ат-тавва̄бу"},{ar:"ٱلْقَمَرُ",hl:"لْ",c:"izhar",note:"аль-камару — лям ясный"},{ar:"ٱلْحَمْدُ",hl:"لْ",c:"izhar",note:"аль-хамду"},{ar:"ٱلْكِتَٰبُ",hl:"لْ",c:"izhar",note:"аль-кита̄бу"}],
 quiz:[{q:"Как читается это слово?",ar:"ٱلصَّبْرِ",o:["аль-сабри","ас-сабри","ас-сабару"],a:1,e:"Сад — солнечная буква, лям сливается с ней."},
  {q:"Какая буква лунная?",o:["ر","ن","ق","س"],ar_opts:true,a:2,e:"Коф (ق) — лунная буква."},
  {q:"Как узнать солнечную букву в тексте?",o:["Над лямом сукун","На букве после ляма ташдид, а у ляма нет знака","По цвету"],a:1,e:"Ташдид на следующей букве показывает слияние."}]},

{id:"qalqala",short:"Пять букв ق ط ب ج د с сукуном дают лёгкий отскок звука.",sec:"Артикль и звуки",title:"Калькаля",ar:"ٱلْقَلْقَلَةُ",
 body:["Калькаля — лёгкий «отскок» звука, когда одна из пяти букв стоит с сукуном. Буквы собраны в выражении «قُطْبُ جَدٍّ».","Звук не превращается в гласную: это короткий толчок, а не [а] или [э].","Калькаля бывает малой — в середине слова, и большой — при остановке в конце слова. Самая сильная — при остановке на букве с ташдидом: ٱلْحَقّ."],
 sets:[{h:"Буквы калькаля",l:"ق ط ب ج د"}],
 examples:[{ar:"يَقْطَعُونَ",hl:"قْ",c:"qalqala",note:"як-то‘ӯна — малая"},{ar:"قَدْ",hl:"دْ",c:"qalqala",note:"кад — малая"},{ar:"يَجْعَلُونَ",hl:"جْ",c:"qalqala",note:"яд-ж‘алӯна"},{ar:"أَطْعَمَهُم",hl:"طْ",c:"qalqala",note:"ат-‘амахум"},{ar:"ٱلْفَلَقِ",hl:"قِ",c:"qalqala",note:"при остановке «аль-фаляк» — большая"},{ar:"أَحَدٌ",hl:"دٌ",c:"qalqala",note:"при остановке «ахад» — большая"}],
 quiz:[{q:"Сколько букв калькаля?",o:["3","5","7","15"],a:1,e:"ق ط ب ج د — пять букв."},
  {q:"Какая буква относится к калькаля?",o:["س","د","ن","م"],ar_opts:true,a:1,e:"Даль (د) — из «قُطْبُ جَدٍّ»."},
  {q:"Когда возникает калькаля?",o:["Буква с фатхой","Буква с сукуном","Любая буква в начале слова"],a:1,e:"Отскок слышен, когда у буквы нет гласной."},
  {q:"Где калькаля сильнее?",o:["В середине слова","При остановке в конце слова"],a:1,e:"При остановке калькаля большая."}]},

{id:"ghunna",short:"Мим и нун с ташдидом тянут через нос на 2 счёта.",sec:"Буквы мим и нун",title:"Мим и нун с ташдидом",ar:"ٱلْمِيمُ وَٱلنُّونُ ٱلْمُشَدَّدَتَانِ",
 body:["Если мим или нун стоят с ташдидом, обязательна гунна — проведение звука через нос.","Гунна длится две огласовки. Проверить легко: если зажать нос, звук гунны прервётся."],
 examples:[{ar:"ثُمَّ",hl:"مَّ",c:"ghunna",note:"сумма — гунна на миме"},{ar:"إِنَّ",hl:"نَّ",c:"ghunna",note:"инна — гунна на нуне"},{ar:"لَمَّا",hl:"مَّ",c:"ghunna",note:"ламма̄"},{ar:"فِى ٱلْيَمِّ",hl:"مِّ",c:"ghunna",note:"филь-ямми"},{ar:"جَهَنَّمَ",hl:"نَّ",c:"ghunna",note:"джаханнама"},{ar:"ٱلْجِنَّةِ وَٱلنَّاسِ",hl:"نَّ",c:"ghunna",note:"аль-джиннати ван-на̄с"}],
 quiz:[{q:"Что такое гунна?",o:["Удлинение гласной","Проведение звука через нос","Отскок звука","Пауза"],a:1,e:"Гунна — назализация."},
  {q:"Сколько длится гунна?",o:["1 огласовку","2 огласовки","4 огласовки"],a:1,e:"Две огласовки."},
  {q:"В каком слове обязательна гунна?",o:["ثُمَّ","قُلْ","كَتَبَ","رَبَّ"],ar_opts:true,a:0,e:"Мим с ташдидом — гунна."}]},

{id:"mim-sakina",short:"Мим с сукуном: перед م — слияние, перед ب — скрыто, перед остальными — ясно.",sec:"Буквы мим и нун",title:"Мим с сукуном",ar:"أَحْكَامُ ٱلْمِيمِ ٱلسَّاكِنَةِ",
 body:["Правило зависит от буквы, которая идёт после мима с сукуном. Всего три случая."],
 rules:[{n:"Идгам шафави",l:"م",d:"После мима снова мим: два мима сливаются в один с ташдидом и гунной."},{n:"Ихфа шафави",l:"ب",d:"После мима буква ба: мим читается скрыто, губы мягко сомкнуты, с гунной."},{n:"Изхар шафави",l:"все остальные",d:"Мим читается ясно, без гунны. Особенно следите за ним перед و и ف: губы легко «перескакивают» на эти звуки."}],
 tip:{h:"Подсказка в мусхафе",t:"При идгаме и ихфа над мимом нет сукуна, а на следующем миме стоит ташдид. При изхаре сукун над мимом написан."},
 examples:[{ar:"لَهُم مَّا",hl:"م مَّ",c:"ghunna",note:"Идгам: лахумма̄"},{ar:"كَم مِّن فِئَةٍ",hl:"م مِّ",c:"ghunna",note:"Идгам: каммин фи’атин"},{ar:"تَرْمِيهِم بِحِجَارَةٍ",hl:"م بِ",c:"ghunna",note:"Ихфа шафави: мим скрыто перед ба"},{ar:"وَهُم بِٱلْـَٔاخِرَةِ",hl:"م بِ",c:"ghunna",note:"Ихфа шафави: вахум бил-а̄хирати"},{ar:"هُمْ فِيهَا",hl:"مْ",c:"izhar",note:"Изхар: хум фӣха̄"},{ar:"عَلَيْهِمْ وَلَا",hl:"مْ",c:"izhar",note:"Изхар перед вав"}],
 quiz:[{q:"Какое правило в этом примере?",ar:"كُنتُم مُّؤْمِنِينَ",o:["Идгам шафави","Ихфа шафави","Изхар шафави"],a:0,e:"Мим перед мимом — идгам."},
  {q:"Какая буква вызывает ихфа шафави?",o:["م","ب","و","ف"],ar_opts:true,a:1,e:"Мим с сукуном перед ба."},
  {q:"Какое правило в этом примере?",ar:"لَعَلَّكُمْ تَتَّقُونَ",o:["Идгам шафави","Ихфа шафави","Изхар шафави"],a:2,e:"Перед та мим читается ясно."}]},

{id:"izhar",short:"Нун с сукуном или танвин перед шестью горловыми буквами читается ясно.",sec:"Нун с сукуном и танвин",title:"Изхар",ar:"ٱلْإِظْهَارُ ٱلْحَلْقِيُّ",
 body:["Если после нуна с сукуном или танвина идёт одна из шести горловых букв, нун читается ясно, без гунны.","Эти буквы произносятся из горла, далеко от места нуна, поэтому звуки не сливаются. Правило действует и внутри слова, и на стыке слов."],
 sets:[{h:"Горловые буквы",l:"ء ه ع ح غ خ"}],
 examples:[{ar:"مَنْ ءَامَنَ",hl:"نْ",c:"izhar",note:"ман а̄мана"},{ar:"مِنْ عِلْمٍ",hl:"نْ",c:"izhar",note:"мин ‘ильмин"},{ar:"يَنْهَوْنَ",hl:"نْ",c:"izhar",note:"янхауна — внутри слова"},{ar:"أَنْعَمْتَ",hl:"نْ",c:"izhar",note:"ан‘амта"},{ar:"مِنْ خَوْفٍ",hl:"نْ",c:"izhar",note:"мин хауфин"},{ar:"عَذَابٌ أَلِيمٌ",hl:"بٌ",c:"izhar",note:"‘аза̄бун алӣм — танвин тоже ясно"},{ar:"عَلِيمٌ حَكِيمٌ",hl:"مٌ",c:"izhar",note:"‘алӣмун хакӣм"}],
 quiz:[{q:"Сколько букв изхара?",o:["6","4","2","15"],a:0,e:"Шесть горловых букв."},
  {q:"Как читать нун в этом примере?",ar:"مِنْ هَادٍ",o:["Ясно, без гунны","Через нос, скрыто","Как мим"],a:0,e:"Перед ه — изхар."},
  {q:"Какая буква относится к изхару?",o:["ي","ح","ق","ل"],ar_opts:true,a:1,e:"Ха (ح) — горловая буква."}]},

{id:"idgham",short:"Нун с сукуном или танвин сливается со следующим словом: перед ي ن م و с гунной, перед ل ر без неё.",sec:"Нун с сукуном и танвин",title:"Идгам",ar:"ٱلْإِدْغَامُ",
 body:["Идгам — слияние нуна с сукуном или танвина со следующей буквой. Работает только на стыке двух слов.","Идгам с гунной — перед буквами ي ن م و (слово «يَنْمُو»). Идгам без гунны — перед ل и ر."],
 rules:[{n:"С гунной",l:"ي ن م و",d:"Нун переходит в следующую букву, звук идёт через нос две огласовки."},{n:"Без гунны",l:"ل ر",d:"Нун полностью исчезает, следующая буква читается с ташдидом."}],
 tip:{h:"Исключения",t:"Внутри одного слова идгама нет: دُنْيَا, بُنْيَٰنٌ, قِنْوَانٌ, صِنْوَانٌ — нун читается ясно. В «يسٓ ۚ وَٱلْقُرْءَانِ» и «نٓ ۚ وَٱلْقَلَمِ» по Хафсу тоже изхар."},
 examples:[{ar:"مَن يَقُولُ",hl:"ن يَ",c:"ghunna",note:"май-якӯлю — с гунной"},{ar:"مِن نِّعْمَةٍ",hl:"ن نِّ",c:"ghunna",note:"мин-ни‘матин — с гунной"},{ar:"مِن وَالٍ",hl:"ن وَ",c:"ghunna",note:"мив-ва̄лин — с гунной"},{ar:"خَيْرًا يَرَهُۥ",hl:"رًا يَ",c:"ghunna",note:"хайрай-яраху — танвин с гунной"},{ar:"مِن رَّبِّهِمْ",hl:"ن رَّ",c:"silent",note:"мир-раббихим — без гунны"},{ar:"غَفُورٌ رَّحِيمٌ",hl:"رٌ رَّ",c:"silent",note:"гафӯрур-рахӣм — без гунны"},{ar:"مِن لَّدُنْهُ",hl:"ن لَّ",c:"silent",note:"мил-ладунху — без гунны"}],
 quiz:[{q:"Какие буквы дают идгам без гунны?",o:["ل ر","ي و","م ن","ب"],a:0,e:"Лям и ра."},
  {q:"Как читается этот пример?",ar:"مِن رِّزْقِ ٱللَّهِ",o:["мин ризкилляхи","мир-ризкилляхи","мим-ризкилляхи"],a:1,e:"Нун сливается с ра без гунны."},
  {q:"Как читается нун в слове دُنْيَا?",o:["Ясно — это одно слово","С идгамом и гунной","Скрыто"],a:0,e:"Внутри одного слова идгама нет."},
  {q:"Какое слово помогает запомнить буквы идгама с гунной?",o:["يَنْمُو","قُطْبُ جَدٍّ","حَيٌّ طَهُرَ"],a:0,e:"ي ن م و — «янму»."}]},

{id:"iqlab",short:"Нун с сукуном или танвин перед ب превращается в мим с гунной.",sec:"Нун с сукуном и танвин",title:"Икляб",ar:"ٱلْإِقْلَابُ",
 body:["Если после нуна с сукуном или танвина стоит буква ب, нун превращается в мим и читается скрыто, с гунной на две огласовки.","В мусхафе над таким нуном или вместо второго знака танвина пишут маленький мим — это подсказка. Правило действует и внутри слова, и на стыке слов."],
 sets:[{h:"Буква икляба",l:"ب"}],
 examples:[{ar:"مِنۢ بَعْدِ",hl:"نۢ",c:"ghunna",note:"мимба‘ди"},{ar:"أَنۢبِئْهُم",hl:"نۢ",c:"ghunna",note:"амби’хум — внутри слова"},{ar:"سَمِيعٌۢ بَصِيرٌ",hl:"عٌۢ",c:"ghunna",note:"самӣ‘ум басӣр"},{ar:"لَنَسْفَعًۢا بِٱلنَّاصِيَةِ",hl:"عًۢا",c:"ghunna",note:"ланасфа‘ам бин-на̄сыях"},{ar:"يَنۢبُوعًا",hl:"نۢ",c:"ghunna",note:"ямбӯ‘а̄"}],
 quiz:[{q:"Какая буква вызывает икляб?",o:["ب","م","ن","ف"],ar_opts:true,a:0,e:"Только ба."},
  {q:"Во что превращается нун при икляб?",o:["В мим","В ба","В лям"],a:0,e:"Нун читается как скрытый мим с гунной."},
  {q:"Какая подсказка бывает в мусхафе?",o:["Маленький мим над нуном","Ташдид","Сукун"],a:0,e:"Маленький мим показывает икляб."}]},

{id:"ikhfa",short:"Перед 15 буквами нун с сукуном или танвин читается скрыто, через нос.",sec:"Нун с сукуном и танвин",title:"Ихфа",ar:"ٱلْإِخْفَاءُ",
 body:["Ихфа — скрытое чтение нуна с сукуном или танвина перед пятнадцатью буквами.","Кончик языка не прижимается к месту нуна, звук идёт через нос, гунна длится две огласовки. Язык заранее готовится к следующей букве: перед твёрдой буквой гунна звучит глубже, перед мягкой — тоньше."],
 sets:[{h:"Буквы ихфа (15)",l:"ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك"}],
 examples:[{ar:"مِن قَبْلِ",hl:"ن قَ",c:"ghunna",note:"мин кабли — гунна глубокая"},{ar:"أَنتُمْ",hl:"نتُ",c:"ghunna",note:"антум"},{ar:"كُنتُمْ",hl:"نتُ",c:"ghunna",note:"кунтум"},{ar:"إِن يَنصُرْكُمُ",hl:"نصُ",c:"ghunna",note:"ий-янсуркуму — внутри слова ихфа"},{ar:"مِن شَرِّ",hl:"ن شَ",c:"ghunna",note:"мин шарри"},{ar:"رِيحًا صَرْصَرًا",hl:"حًا صَ",c:"ghunna",note:"рӣхан сарсаран"},{ar:"عُمْيٌ فَهُمْ",hl:"يٌ فَ",c:"ghunna",note:"‘умйун фахум"}],
 quiz:[{q:"Сколько букв ихфа?",o:["6","2","15","4"],a:2,e:"Пятнадцать букв."},
  {q:"Какое правило в этом слове?",ar:"عَنكُمْ",o:["Ихфа","Изхар","Идгам","Икляб"],a:0,e:"Нун с сукуном перед каф — ихфа."},
  {q:"Какая буква относится к ихфа?",o:["ق","ع","ب","ل"],ar_opts:true,a:0,e:"Коф (ق) — одна из 15."},
  {q:"Какое правило в этом примере?",ar:"مِن ثَمَرَةٍ",o:["Ихфа","Идгам без гунны","Изхар"],a:0,e:"Са (ث) — буква ихфа."}]},

/* ───────── МАДЫ ───────── */
{id:"muttasil",short:"Буква мада перед хамзой тянется на 4–5 счётов, в одном слове и на стыке слов.",sec:"Удлинения (мады)",title:"Мад муттасыль и мунфасыль",ar:"ٱلْمَدُّ ٱلْمُتَّصِلُ وَٱلْمُنْفَصِلُ",
 body:["Когда после буквы мада идёт хамза, удлинение становится больше естественного. Над буквой мада в мусхафе ставят волнистый знак ٓ.","Важно, где стоит хамза: в том же слове или в следующем."],
 rules:[{n:"Мад муттасыль",l:"جَآءَ",d:"Буква мада и хамза в одном слове. Удлинение обязательное: 4 или 5 огласовок. При остановке на хамзе — до 6."},{n:"Мад мунфасыль",l:"بِمَآ أُنزِلَ",d:"Буква мада в конце слова, хамза в начале следующего. По Хафсу через Шатыбию — 4 или 5 огласовок."}],
 tip:{h:"Держите одну длину",t:"Выбрав длину (например, 4 огласовки), держите её одинаковой во всём чтении. Мунфасыль не может быть длиннее муттасыля."},
 examples:[{ar:"جَآءَ",hl:"جَآ",c:"madd",note:"джа̄’а — муттасыль"},{ar:"ٱلسَّمَآءِ",hl:"مَآ",c:"madd",note:"ас-сама̄’и — муттасыль"},{ar:"سُوٓءَ",hl:"سُوٓ",c:"madd",note:"сӯ’а — муттасыль"},{ar:"بِمَآ أُنزِلَ",hl:"مَآ",c:"madd",note:"бима̄ унзиля — мунфасыль"},{ar:"إِنَّآ أَعْطَيْنَٰكَ",hl:"نَّآ",c:"madd",note:"инна̄ а‘тойна̄ка — мунфасыль"},{ar:"فِىٓ أَنفُسِكُمْ",hl:"فِىٓ",c:"madd",note:"фӣ анфусикум — мунфасыль"}],
 quiz:[{q:"Хамза в том же слове, что и буква мада. Это…",o:["Мад муттасыль","Мад мунфасыль","Мад табии"],a:0,e:"Муттасыль — «соединённый»."},
  {q:"Какой мад в примере?",ar:"فِىٓ ءَاذَانِهِمْ",o:["Муттасыль","Мунфасыль","Лязим"],a:1,e:"Хамза в начале следующего слова."},
  {q:"Сколько длится мад муттасыль по Хафсу?",o:["2","4–5","Только 6"],a:1,e:"4 или 5 огласовок, при остановке на хамзе — до 6."}]},

{id:"sila",short:"Окончание «-ху/-хи» между двумя огласовками тянут: на 2, а перед хамзой — на 4–5.",sec:"Удлинения (мады)",title:"Мад сыля",ar:"مَدُّ ٱلصِّلَةِ",
 body:["Мад сыля касается местоимения «ху/хи» (ـهُۥ / ـهِۦ) в конце слова. Если оно стоит между двумя буквами с огласовкой, гласный удлиняется. В мусхафе для этого пишут маленький вав или йа.","Сыля сугра (малая): следующее слово начинается не с хамзы — 2 огласовки. Сыля кубра (большая): следующее слово начинается с хамзы — 4 или 5, как мунфасыль."],
 tip:{h:"Когда сыли нет",t:"Если после ха идёт сукун (لَهُ ٱلْمُلْكُ) или перед ха стоит буква с сукуном (فِيهِ هُدًى), удлинения нет. Исключение по Хафсу — فِيهِۦ مُهَانًا (25:69): здесь удлиняют. В يَرْضَهُ لَكُمْ (39:7) — не удлиняют."},
 examples:[{ar:"إِنَّهُۥ كَانَ",hl:"هُۥ",c:"madd",note:"иннахӯ ка̄на — сугра, 2"},{ar:"بِهِۦ بَصِيرًا",hl:"هِۦ",c:"madd",note:"бихӣ басӣра̄ — сугра, 2"},{ar:"مَالَهُۥٓ أَخْلَدَهُۥ",hl:"هُۥٓ",c:"madd",note:"ма̄лахӯ ахладах — кубра, 4–5"},{ar:"عِندَهُۥٓ إِلَّا",hl:"هُۥٓ",c:"madd",note:"‘индахӯ илля̄ — кубра"},{ar:"لَهُ ٱلْمُلْكُ",hl:"هُ",c:"izhar",note:"лахуль-мульку — сыли нет"}],
 quiz:[{q:"Что удлиняется при мад сыля?",o:["Местоимение ـهُ / ـهِ","Любая буква ха","Артикль"],a:0,e:"Только местоимение «ху/хи» между двумя огласовками."},
  {q:"Какая сыля в примере?",ar:"بِهِۦٓ أَن يُوصَلَ",o:["Сугра — 2","Кубра — 4–5"],a:1,e:"Дальше хамза — кубра."},
  {q:"Есть ли удлинение в لَهُ ٱلْمُلْكُ?",o:["Да","Нет"],a:1,e:"После ха идёт сукун — сыли нет."}]},

{id:"lazim",short:"Буква мада перед ташдидом или сукуном — всегда 6 счётов.",sec:"Удлинения (мады)",title:"Мад лязим",ar:"ٱلْمَدُّ ٱللَّازِمُ",
 body:["Мад лязим — когда после буквы мада идёт постоянный сукун или ташдид в том же слове. Это самое длинное удлинение: всегда 6 огласовок, и при слитном чтении, и при остановке.","Он встречается в словах (калими) и в отдельных буквах в начале сур (харфи)."],
 rules:[{n:"В слове, перед ташдидом",l:"ٱلضَّآلِّينَ",d:"После буквы мада стоит буква с ташдидом. Самый частый случай."},{n:"В слове, перед сукуном",l:"ءَآلْـَٔـٰنَ",d:"После буквы мада — буква с сукуном без ташдида. В Куръане только дважды: 10:51 и 10:91."},{n:"В названии буквы",l:"الٓمٓ",d:"Буквы в начале сур, например «ля̄м», «мӣм». Подробнее в уроке 29."}],
 tip:{h:"Как узнать в мусхафе",t:"Над буквой мада стоит волнистый знак ٓ, а сразу за ней — ташдид или сукун. Тяните ровно 6 огласовок: это примерно три естественных мада подряд."},
 examples:[{ar:"وَلَا ٱلضَّآلِّينَ",hl:"ضَّآ",c:"madd",note:"валяд-до̄ллӣн — 6"},{ar:"ٱلْحَآقَّةُ",hl:"حَآ",c:"madd",note:"аль-ха̄ккоту — 6"},{ar:"دَآبَّةٍ",hl:"دَآ",c:"madd",note:"да̄ббатин — 6"},{ar:"ٱلطَّآمَّةُ",hl:"طَّآ",c:"madd",note:"ат-то̄ммату — 6"},{ar:"ءَآلْـَٔـٰنَ",hl:"ءَآ",c:"madd",note:"а̄ль-а̄на — 6"}],
 quiz:[{q:"Сколько длится мад лязим?",o:["2","4–5","6"],a:2,e:"Всегда 6 огласовок."},
  {q:"Какой мад в слове ٱلضَّآلِّينَ?",o:["Лязим","Муттасыль","Табии"],a:0,e:"После мада буква с ташдидом."},
  {q:"Мад лязим меняется при остановке?",o:["Нет, всегда 6","Да, становится 2"],a:0,e:"Сукун постоянный, длина не меняется."}]},

{id:"arid",short:"При остановке долгий звук перед последней буквой можно тянуть на 2, 4 или 6.",sec:"Удлинения (мады)",title:"Мад ‘арид и мад лин",ar:"ٱلْمَدُّ ٱلْعَارِضُ لِلسُّكُونِ وَمَدُّ ٱللِّينِ",
 body:["Мад ‘арид лис-сукун появляется только при остановке: после буквы мада стоит последняя буква слова, которая из-за остановки получает сукун. Можно тянуть 2, 4 или 6 огласовок.","Мад лин — вав или йа с сукуном после фатхи (ـَوْ ـَيْ), за которыми при остановке идёт сукун. Тоже 2, 4 или 6. В слитном чтении лин не удлиняют."],
 tip:{h:"Одинаково в одном чтении",t:"Выбрав длину, держите её на всех остановках подряд — например, во всей «аль-Фатихе» по 4 огласовки."},
 examples:[{ar:"ٱلْعَٰلَمِينَ",hl:"مِي",c:"madd",note:"при остановке «аль-‘а̄ламӣн» — ‘арид"},{ar:"نَسْتَعِينُ",hl:"عِي",c:"madd",note:"при остановке «наста‘ӣн» — ‘арид"},{ar:"يَعْلَمُونَ",hl:"مُو",c:"madd",note:"при остановке «я‘лямӯн» — ‘арид"},{ar:"خَوْفٍ",hl:"خَوْ",c:"madd",note:"при остановке «хауф» — лин"},{ar:"ٱلْبَيْتِ",hl:"بَيْ",c:"madd",note:"при остановке «аль-байт» — лин"},{ar:"قُرَيْشٍ",hl:"رَيْ",c:"madd",note:"при остановке «курайш» — лин"}],
 quiz:[{q:"Когда возникает мад ‘арид?",o:["Только при остановке","Всегда","Только в начале суры"],a:0,e:"Сукун появляется из-за остановки."},
  {q:"Сколько можно тянуть мад ‘арид?",o:["Только 2","2, 4 или 6","Только 6"],a:1,e:"Три допустимых варианта."},
  {q:"Какой мад при остановке на خَوْفٍ?",o:["Мад лин","Мад лязим","Мад сыля"],a:0,e:"Вав с сукуном после фатхи — лин."}]},

{id:"badal",short:"Хамза перед буквой мада — обычные 2 счёта.",sec:"Удлинения (мады)",title:"Мад бадаль",ar:"مَدُّ ٱلْبَدَلِ",
 body:["Мад бадаль — когда хамза стоит перед буквой мада: ءَا، ءُو، ءِي. Изначально здесь было две хамзы, вторая заменилась буквой мада.","По Хафсу мад бадаль длится 2 огласовки, как естественный."],
 examples:[{ar:"ءَامَنُوا۟",hl:"ءَا",c:"madd",note:"а̄мана̄ — 2"},{ar:"إِيمَٰنًا",hl:"إِي",c:"madd",note:"ӣма̄нан — 2"},{ar:"أُوتُوا۟",hl:"أُو",c:"madd",note:"ӯтӯ — 2"},{ar:"ءَادَمَ",hl:"ءَا",c:"madd",note:"А̄дама — 2"}],
 quiz:[{q:"Где стоит хамза в мад бадаль?",o:["Перед буквой мада","После буквы мада","В следующем слове"],a:0,e:"Хамза перед мадом — бадаль."},
  {q:"Сколько длится мад бадаль по Хафсу?",o:["2","4","6"],a:0,e:"Две огласовки."},
  {q:"Какой мад в слове ءَامَنُوا۟?",o:["Бадаль","Муттасыль","Лязим"],a:0,e:"Хамза, затем алиф — бадаль."}]},

/* ───────── СЛИЯНИЕ БУКВ ───────── */
{id:"mutamathilain",short:"Две одинаковые буквы подряд (первая без гласной) читаются как одна с ташдидом.",sec:"Слияние букв",title:"Идгам одинаковых букв",ar:"إِدْغَامُ ٱلْمُتَمَاثِلَيْنِ",
 body:["Идгам — слияние двух букв в одну. Похоже на русское «под домом», которое в речи звучит как «подомом»: два одинаковых звука сливаются в один долгий.","Если подряд стоят две одинаковые буквы, первая с сукуном, вторая с огласовкой, их читают как одну букву с ташдидом. Это обязательно и в одном слове, и на стыке слов. В мусхафе подсказка такая: над первой буквой нет сукуна, а на второй стоит ташдид."],
 tip:{h:"Исключение — буквы мада",t:"Если первая буква — вав или йа мада, слияния нет: قَالُوا۟ وَهُمْ читается «ка̄лӯ ва хум», فِى يَوْمٍ — «фӣ яумин»."},
 examples:[{ar:"ٱضْرِب بِّعَصَاكَ",hl:"ب بِّ",c:"madd",note:"идриб-би‘аса̄ка"},{ar:"قَد دَّخَلُوا۟",hl:"د دَّ",c:"madd",note:"кад-дахалӯ"},{ar:"رَبِحَت تِّجَٰرَتُهُمْ",hl:"ت تِّ",c:"madd",note:"рабихат-тиджа̄ратухум"},{ar:"يُدْرِككُّمُ",hl:"ككُّ",c:"madd",note:"юдрик-куму — внутри слова"},{ar:"قَالُوا۟ وَهُمْ",hl:"وا۟ وَ",c:"izhar",note:"ка̄лӯ ва хум — без слияния"}],
 quiz:[{q:"Что происходит с двумя одинаковыми буквами (первая с сукуном)?",o:["Сливаются в одну с ташдидом","Читаются раздельно","Первая пропадает без следа"],a:0,e:"Это идгам мутамасиляйн."},
  {q:"Есть ли слияние в فِى يَوْمٍ?",o:["Да","Нет — первая йа буква мада"],a:1,e:"Буквы мада не сливаются."}]},

{id:"mutajanisain",short:"Буква без гласной перед «родственной» буквой из того же места рта исчезает в ней.",sec:"Слияние букв",title:"Идгам родственных букв",ar:"إِدْغَامُ ٱلْمُتَجَانِسَيْنِ",
 body:["Родственные буквы — разные буквы, которые произносятся одним и тем же местом рта. Например, ت и د: обе — кончиком языка у корней верхних зубов. Отличаются они только звонкостью, твёрдостью и т. п.","Если первая из таких букв стоит с сукуном, а вторая с огласовкой, первая полностью переходит во вторую. Читается одна вторая буква с ташдидом. По Хафсу это бывает только в шести парах, перечисленных ниже."],
 rules:[{n:"د → ت",l:"قَد تَّبَيَّنَ",d:"Даль становится та: «кат-табайяна»."},{n:"ت → د",l:"أُجِيبَت دَّعْوَتُكُمَا",d:"Та становится даль: «уджӣбад-да‘ватукума̄»."},{n:"ت → ط",l:"قَالَت طَّآئِفَةٌ",d:"Та становится твёрдой то: «ка̄лят-то̄’ифатун»."},{n:"ط → ت (неполное)",l:"بَسَطتَ",d:"То переходит в та, но её твёрдость слышна: «басатта»."},{n:"ث → ذ",l:"يَلْهَث ذَّٰلِكَ",d:"Са становится заль: «ялхаз-за̄лика» (7:176)."},{n:"ذ → ظ",l:"إِذ ظَّلَمُوٓا۟",d:"Заль становится зо: «из-золямӯ»."},{n:"ب → م",l:"ٱرْكَب مَّعَنَا",d:"Ба становится мим с гунной: «иркам-ма‘ана̄» (11:42)."}],
 tip:{h:"Как узнать в мусхафе",t:"Над первой буквой нет сукуна, а на второй стоит ташдид. Если у первой буквы сукун написан, слияния нет."},
 examples:[{ar:"قَد تَّبَيَّنَ",hl:"د تَّ",c:"madd",note:"кат-табайяна — даль исчезла"},{ar:"أُجِيبَت دَّعْوَتُكُمَا",hl:"ت دَّ",c:"madd",note:"уджӣбад-да‘ватукума̄ — та исчезла"},{ar:"قَالَت طَّآئِفَةٌ",hl:"ت طَّ",c:"madd",note:"ка̄лят-то̄’ифатун"},{ar:"إِذ ظَّلَمُوٓا۟",hl:"ذ ظَّ",c:"madd",note:"из-золямӯ"},{ar:"ٱرْكَب مَّعَنَا",hl:"ب مَّ",c:"ghunna",note:"иркам-ма‘ана̄ — с гунной"},{ar:"بَسَطتَ",hl:"طتَ",c:"heavy",note:"басатта — твёрдость ط остаётся"}],
 quiz:[{q:"Что такое родственные буквы?",o:["Из одного места, разные свойства","Одинаковые буквы","Буквы из соседних мест"],a:0,e:"Мутаджанисайн — один махрадж."},
  {q:"Что остаётся при слиянии в بَسَطتَ?",o:["Твёрдость буквы ط","Гунна","Ничего"],a:0,e:"Это неполный идгам."}]},

{id:"mutaqaribain",short:"Лям перед ра и коф перед каф сливаются: «кур-робби».",sec:"Слияние букв",title:"Идгам близких букв",ar:"إِدْغَامُ ٱلْمُتَقَارِبَيْنِ",
 body:["Близкие буквы произносятся соседними местами рта, например ل и ر: обе кончиком языка, но чуть в разных точках.","Если первая стоит с сукуном, она переходит во вторую, и читается вторая буква с ташдидом. По Хафсу это бывает только в двух случаях: лям с сукуном перед ра и коф с сукуном перед каф."],
 rules:[{n:"ل → ر",l:"قُل رَّبِّ",d:"Лям полностью переходит в ра: «кур-робби»."},{n:"ق → ك",l:"نَخْلُقكُّم",d:"Только в 77:20. Предпочтительно полное слияние: «нахлук-кум»."}],
 tip:{h:"Исключение",t:"В بَلْ ۜ رَانَ (83:14) из-за сакты слияния нет: лям читается ясно."},
 examples:[{ar:"قُل رَّبِّ",hl:"ل رَّ",c:"madd",note:"кур-робби"},{ar:"بَل رَّفَعَهُ",hl:"ل رَّ",c:"madd",note:"бар-рофа‘аху"},{ar:"أَلَمْ نَخْلُقكُّم",hl:"قكُّ",c:"madd",note:"алям нахлук-кум"}],
 quiz:[{q:"Как читается قُل رَّبِّ?",o:["куль робби","кур-робби","кул-любби"],a:1,e:"Лям сливается с ра."},
  {q:"Почему в بَلْ ۜ رَانَ нет слияния?",o:["Из-за сакты","Это одно слово","Ра мягкая"],a:0,e:"Короткая пауза разделяет буквы."}]},

/* ───────── ОСТАНОВКА ───────── */
{id:"waqf",short:"Останавливаются только на конце слова. Последняя огласовка заменяется сукуном.",sec:"Остановка и паузы",title:"Как остановиться",ar:"ٱلْوَقْفُ",
 body:["Вакф — остановка с прерыванием звука и новым вдохом. Останавливаются на конце слова, никогда в середине. Лучше всего — в конце аята.","После остановки чтение продолжают со следующего слова или возвращаются на одно-два слова назад, чтобы не нарушить смысл."],
 rules:[{n:"Огласовка на конце",l:"ٱلرَّحِيمِ ← ٱلرَّحِيمْ",d:"Фатха, кясра и домма заменяются сукуном."},{n:"Танвин с фатхой",l:"عَلِيمًا ← عَلِيمَا",d:"Читается долгое [а̄] — 2 огласовки."},{n:"Та марбута",l:"رَحْمَةٌ ← رَحْمَهْ",d:"Читается [h] с сукуном."},{n:"Долгая гласная",l:"ٱلدُّنْيَا",d:"Сохраняется как есть."}],
 examples:[{ar:"ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ",hl:"مِينَ",c:"madd",note:"…аль-‘а̄ламӣн — сукун и мад ‘арид"},{ar:"وَكَانَ ٱللَّهُ عَلِيمًا حَكِيمًا",hl:"كِيمًا",c:"madd",note:"…хакӣма̄ — танвин в [а̄]"},{ar:"فِى جَنَّةٍ عَالِيَةٍ",hl:"ةٍ",c:"izhar",note:"…‘а̄лиях — та марбута в [h]"}],
 quiz:[{q:"Где можно остановиться?",o:["Только на конце слова","В любом месте","В середине слова"],a:0,e:"Остановка — только на конце слова."},
  {q:"Что делают с последней огласовкой при остановке?",o:["Заменяют сукуном","Удлиняют","Оставляют"],a:0,e:"Кроме танвина с фатхой и та марбута."},
  {q:"Как остановиться на حَكِيمًا?",o:["хакӣм","хакӣма̄","хакӣман"],a:1,e:"Танвин с фатхой превращается в долгое [а̄]."}]},

{id:"waqf-signs",short:"Маленькие знаки над строкой подсказывают, где можно остановиться, а где нельзя.",sec:"Остановка и паузы",title:"Знаки остановки",ar:"عَلَامَاتُ ٱلْوَقْفِ",
 body:["Внутри длинного аята дыхания может не хватить. Чтобы остановиться и не исказить смысл, в мединском мусхафе над строкой стоят маленькие знаки. Они похожи на крошечные буквы и стоят сразу после слова, на котором можно (или нельзя) остановиться.","Знаков шесть. Ниже — что означает каждый, а в примерах — где он встречается в Куръане и почему стоит именно там."],
 rules:[{n:"Обязательно остановиться",l:"مـ",d:"Маленький мим. Если прочитать слитно, получится другой смысл."},{n:"Не останавливаться",l:"لا",d:"Внутри аята остановка оборвёт мысль на полуслове. Если этот знак стоит в конце аята, остановиться можно."},{n:"Можно и так, и так",l:"ج",d:"Маленький джим. Остановиться или продолжить — одинаково правильно."},{n:"Лучше продолжить",l:"صلى",d:"Остановиться можно, но мысль продолжается, поэтому лучше читать дальше."},{n:"Лучше остановиться",l:"قلى",d:"Продолжить можно, но мысль здесь закончилась, поэтому лучше остановиться."},{n:"Одно из двух",l:"∴ … ∴",d:"Три точки стоят в двух местах рядом. Остановиться можно на первом или на втором, но не на обоих."}],
 tip:{h:"Простое правило для начинающих",t:"Останавливайтесь в конце аята (кружок с номером). Если воздуха не хватает раньше, ищите знаки ج, قلى или صلى. На знаке لا внутри аята не останавливайтесь. А если пришлось остановиться в неудачном месте, вернитесь на одно-два слова назад и прочитайте снова."},
 examples:[
  {ar:"فَلَا يَحْزُنكَ قَوْلُهُمْ ۘ إِنَّا نَعْلَمُ",hl:"ۘ",c:"madd",note:"36:76 · مـ обязательная остановка. «Пусть не печалят тебя их слова. Мы знаем…» Без остановки выйдет, будто «Мы знаем…» говорят они."},
  {ar:"تَتَوَفَّىٰهُمُ ٱلْمَلَٰٓئِكَةُ طَيِّبِينَ ۙ يَقُولُونَ سَلَٰمٌ عَلَيْكُمُ",hl:"ۙ",c:"madd",note:"16:32 · لا не останавливаться. «…ангелы упокаивают их, чистыми, говоря: мир вам». Остановка оторвёт «говоря» от ангелов."},
  {ar:"نَبَأَهُم بِٱلْحَقِّ ۚ إِنَّهُمْ فِتْيَةٌ",hl:"ۚ",c:"madd",note:"18:13 · ج можно и так, и так. «…их историю истинно. Они — юноши…» Начинается новое предложение."},
  {ar:"وَعَلَىٰ سَمْعِهِمْ ۖ وَعَلَىٰٓ أَبْصَٰرِهِمْ غِشَٰوَةٌ",hl:"ۖ",c:"madd",note:"2:7 · صلى лучше продолжить. «…и на их слух, а на их взорах — покрывало». Мысль ещё идёт."},
  {ar:"مَّا يَعْلَمُهُمْ إِلَّا قَلِيلٌ ۗ فَلَا تُمَارِ فِيهِمْ",hl:"ۗ",c:"madd",note:"18:22 · قلى лучше остановиться. «…их знают лишь немногие. Не спорь же о них…» Мысль закончилась."},
  {ar:"ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى",hl:"ۛ",c:"madd",note:"2:2 · ∴ одно из двух. «Нет сомнения. В нём — руководство» или «Нет сомнения в нём. Руководство…» Оба смысла верны, но остановиться можно только в одном месте."}],
 quiz:[{q:"Что означает знак مـ?",o:["Обязательная остановка","Не останавливаться","Остановка допустима"],a:0,e:"Лязим — обязательная остановка."},
  {q:"Что означает знак ج?",o:["Можно и остановиться, и продолжить","Лучше продолжить","Запрещено останавливаться"],a:0,e:"Джаиз — оба варианта равноценны."},
  {q:"Знак ∴ стоит в двух местах рядом. Как быть?",o:["Остановиться на одном из них","Остановиться на обоих","Нигде не останавливаться"],a:0,e:"Муа‘анака: только одна остановка из двух."}]},

{id:"sakta",short:"В четырёх местах Куръана — короткая пауза без вдоха.",sec:"Остановка и паузы",title:"Сакта",ar:"ٱلسَّكْتُ",
 body:["Сакта — короткая пауза без вдоха, около двух огласовок. По Хафсу через Шатыбию она обязательна в четырёх местах. В мусхафе её обозначает маленькая буква س над словом.","Делается так: голос замолкает на мгновение, но воздух не набирают, и чтение сразу продолжается.","Сакта меняет чтение: в مَنْ ۜ رَاقٍ нет идгама, нун читается ясно; в بَلْ ۜ رَانَ лям не сливается с ра."],
 examples:[{ar:"عِوَجَا ۜ قَيِّمًا",hl:"ۜ",c:"silent",note:"18:1–2 — ‘иваджа̄ [пауза] кайиман"},{ar:"مِن مَّرْقَدِنَا ۜ هَٰذَا",hl:"ۜ",c:"silent",note:"36:52 — маркадина̄ [пауза] ха̄за̄"},{ar:"وَقِيلَ مَنْ ۜ رَاقٍ",hl:"ۜ",c:"silent",note:"75:27 — ман [пауза] ра̄к"},{ar:"كَلَّا ۖ بَلْ ۜ رَانَ",hl:"ۜ",c:"silent",note:"83:14 — баль [пауза] ра̄на"}],
 quiz:[{q:"Чем сакта отличается от вакфа?",o:["Пауза без вдоха","Пауза со вдохом","Ничем"],a:0,e:"При сакте дыхание не берут."},

{id:"muqattaa",short:"Буквы в начале сур читают по названиям: «алиф, ля̄м, мӣм». Короткие названия — 2 счёта, длинные — 6.",sec:"Остановка и паузы",title:"Буквы в начале сур",ar:"ٱلْحُرُوفُ ٱلْمُقَطَّعَةُ",
 body:["В начале 29 сур стоят отдельные буквы. Их читают не как слово, а по названиям букв, как при чтении алфавита: الٓمٓ — «алиф, ля̄м, мӣм».","Сколько тянуть, зависит от названия буквы. Если оно короткое, как «ха̄» или «ро̄», тянут 2 огласовки. Если в названии три звука с долгой гласной в середине, как «ля̄м» или «мӣм», тянут 6. Над такими буквами в мусхафе стоит волнистый знак ٓ."],
 rules:[{n:"Без удлинения",l:"ا",d:"Алиф: «алиф» — мада нет."},{n:"2 огласовки",l:"ح ي ط ه ر",d:"Названия из двух звуков: ха̄, йа̄, то̄, ха̄, ро̄. Фраза: «حَيٌّ طَهُرَ»."},{n:"6 огласовок",l:"ن ق ص س ل ك م",d:"Названия из трёх звуков с мадом: нӯн, ко̄ф, са̄д… Фраза: «نَقَصَ عَسَلُكُمْ»."},{n:"4 или 6",l:"ع",d:"‘айн: мад лин в названии — 4 или 6, лучше 6."}],
 tip:{h:"Слияние на стыке",t:"В الٓمٓ мим из «ля̄м» сливается с мимом следующего названия: «алиф ля̄ммӣм» — с гунной. В طسٓمٓ нун сливается с мимом: «то̄ сӣммӣм»."},

function ring(p,num){

}
/* Keep letters joined across a highlight: add a zero-width joiner where both neighbours connect */
const DUAL="بتثجحخسشصضطظعغفقكلمنهيىئـ", RIGHT="اأإآٱدذرزوؤة", MARK=/[\u064B-\u065F\u0670\u06D6-\u06E4\u06E7\u06E8\u06EA-\u06ED]/;
function baseBefore(s){for(let i=s.length-1;i>=0;i--){if(!MARK.test(s[i]))return s[i]}return ""}
function baseAfter(s){for(const ch of s){if(!MARK.test(ch))return ch}return ""}
function joins(a,b){return DUAL.includes(baseBefore(a))&&(DUAL.includes(baseAfter(b))||RIGHT.includes(baseAfter(b)))}
function hlAr(ar,hl,c){
  if(!hl) return esc(ar);
  const i=ar.indexOf(hl); if(i<0) return esc(ar);
  const pre=ar.slice(0,i), post=ar.slice(i+hl.length), Z="\u200D";
  const j1=pre&&joins(pre,hl)?Z:"", j2=post&&joins(hl,post)?Z:"";
  return esc(pre)+j1+`<mark class="${c||"madd"}">${j1}${esc(hl)}${j2}</mark>`+j2+esc(post);
}

const player=new Audio(); let playingBtn=null, queue=[], startAt=0;
function resetBtn(b){if(!b)return;b.classList.remove("on");b.querySelector(".ic").textContent="▶"}
function stopAudio(){player.pause();queue=[];resetBtn(playingBtn);playingBtn=null}
function playNext(){const f=queue.shift(); if(!f){stopAudio();return}
  player.src=f; const st=startAt; startAt=0;
  if(st>0) player.addEventListener("loadedmetadata",()=>{try{player.currentTime=Math.min(st,Math.max(0,player.duration-1))}catch(e){}},{once:true});
  player.play().catch(()=>stopAudio())}
player.addEventListener("ended",playNext);
player.addEventListener("error",()=>{if(playingBtn)playingBtn.querySelector(".lbl").textContent="Не удалось загрузить";stopAudio()});
function toggleAudio(btn,files,from){
  if(playingBtn===btn){stopAudio();return}

  queue=files.slice(); startAt=from||0; playNext();
}

const SKN={"ٱ":"","ا":"","أ":"","إ":"","آ":"","ى":"ي","ئ":"ي","ؤ":"و","ة":"ه"};
function skel(t){const out=[];for(let i=0;i<t.length;i++){const ch=t[i];if(SKM.test(ch))continue;const m=ch in SKN?SKN[ch]:ch;if(m)out.push([m,i])}return out}
function fragHL(f,hl,c){
  if(!hl) return esc(f);
  if(f.indexOf(hl)>=0) return hlAr(f,hl,c);
  const F=skel(f),H=skel(hl).map(x=>x[0]).join(""); if(!H) return esc(f);
  const fs=F.map(x=>x[0]).join(""), k=fs.indexOf(H); if(k<0) return esc(f);

}

}

  if(!e.au[0][1]) return `<div class="plays"><button class="play" data-i="${i}" data-m="all"><span class="ic">▶</span><span class="lbl">Слушать</span></button></div>`;
  const ref=e.au.map(x=>x[1]+":"+x[2]).join("–"), st=exStart(e);
  return `<div class="plays">${st>2?`<button class="play" data-i="${i}" data-m="from"><span class="ic">▶</span><span class="lbl">С примера · ${fmt(st)}</span></button>`:""}<button class="play ghost" data-i="${i}" data-m="all"><span class="ic">▶</span><span class="lbl">${st>2?"Весь аят":"Аят"} ${ref}</span></button></div>`;
}

function home(){
  const total=LESSONS.length, done=LESSONS.filter(l=>(progress[l.id]||0)>=80).length;
  const next=LESSONS.find(l=>(progress[l.id]||0)<80)||LESSONS[0];
  let html=`<header class="brand"><h1>Тартиль</h1><span class="ar">تَجْوِيد</span></header>
  <p class="lead">Правила чтения Куръана по шагам, по чтению Хафса от ‘Асыма. Короткий урок, примеры из аятов и тест в конце. Тема засчитывается, когда тест сдан на 80% и выше.</p>
  <section class="overall"><div class="row"><b>Пройдено ${done} из ${total}</b><span>${Math.round(done/total*100)}%</span></div>
  <div class="bar"><i style="width:${done/total*100}%"></i></div>
  <a class="btn" href="#${next.id}">${done?"Продолжить":"Начать"}: ${t(next.title)}</a></section>
  <div class="legend" aria-label="Цвета в примерах"><span><b style="background:var(--t-ghunna)"></b>гунна</span><span><b style="background:var(--t-madd)"></b>удлинение, ташдид, слияние</span><span><b style="background:var(--t-qalqala)"></b>калькаля</span><span><b style="background:var(--t-heavy)"></b>твёрдо</span><span><b style="background:var(--t-izhar)"></b>ясно, мягко</span><span><b style="background:var(--t-silent)"></b>не читается, пауза</span></div>`;
  const secs=[...new Set(LESSONS.map(l=>l.sec))];
  secs.forEach(sec=>{
    const ls=LESSONS.filter(l=>l.sec===sec), d=ls.filter(l=>(progress[l.id]||0)>=80).length;
    html+=`<h2 class="section-h">${t(sec)}<span>${d}/${ls.length}</span></h2><div class="list">`;
    ls.forEach(l=>{
      const i=LESSONS.indexOf(l), p=progress[l.id]||0;
      html+=`<a class="item" href="#${l.id}">${ring(p,i+1)}<span class="t"><b>${t(l.title)}</b><span class="ar">${t(l.ar)}</span></span>
      <span class="chev">${p?'<span class="done-tag">'+p+'%</span>':"›"}</span></a>`;
    });
    html+=`</div>`;
  });
  const rv=progress.__review;
  html+=`<section class="review"><h2>Итоговый тест</h2><p>15 случайных вопросов из всех тем.${rv!=null?" Лучший результат: "+rv+"%.":""}</p><a class="btn" href="#review">Начать тест</a></section>`;
  app.innerHTML=html;
}

function lesson(l){
  const i=LESSONS.indexOf(l), next=LESSONS[i+1];
  let h=`<div class="topbar"><a class="back" href="#">‹ Темы</a><span class="mid">${t(l.title)}</span><a class="btn ghost" href="#${l.id}-test">Тест</a></div>
  <div class="lesson-head"><span class="num">УРОК ${i+1} ИЗ ${LESSONS.length} · ${t(l.sec.toUpperCase())}</span><span class="ar">${t(l.ar)}</span><h2>${t(l.title)}</h2></div>
  ${l.short?`<div class="short"><b>Коротко</b>${t(l.short)}</div>`:""}
  <div class="prose">${l.body.map(p=>`<p>${t(p)}</p>`).join("")}</div>`;
  if(l.signs) h+=`<div class="signs">${l.signs.map(s=>`<div class="sign"><span class="ar">${t(s.ar)}</span><b>${t(s.name)}</b><br><small>${t(s.s)}</small></div>`).join("")}</div>`;
  if(l.sets) l.sets.forEach(s=>{h+=`<h3 class="sub">${t(s.h)}</h3><div class="letterset">${s.l.split(" ").map(c=>`<span>${t(c)}</span>`).join("")}</div>`});
  if(l.rules) h+=`<div class="rules">${l.rules.map(r=>`<div class="rule"><h4>${t(r.n)}</h4><span class="letters ar">${t(r.l)}</span><p>${t(r.d)}</p></div>`).join("")}</div>`;
  if(l.tip) h+=`<div class="tip"><b>${t(l.tip.h)}</b>${t(l.tip.t)}</div>`;
  h+=`<h3 class="sub">Примеры</h3><div class="examples">${l.examples.map((e,i)=>`<div class="ex"><span class="ar">${hlAr(e.ar,e.hl,e.c)}</span><span class="note">${t(e.note)}</span>${ctxBlock(e)}${auBtns(e,i)}</div>`).join("")}</div>
  ${l.examples.some(e=>e.au)?`<p class="credit">Чтение: шейх Мишари Рашид аль-Афаси. «С примера» включает запись за пару секунд до нужного места (время примерное), «Весь аят» — с начала.</p>`:""}
  <div class="lesson-foot"><a class="btn" href="#${l.id}-test">Пройти тест</a>${next?`<a class="btn ghost" href="#${next.id}">Следующий урок ›</a>`:`<a class="btn ghost" href="#review">Итоговый тест</a>`}</div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  app.querySelectorAll(".play").forEach(b=>b.addEventListener("click",()=>{const e=l.examples[+b.dataset.i],m=b.dataset.m;
    if(m==="own") return toggleAudio(b,[e.own]);
    toggleAudio(b,e.au.map(x=>"audio/"+x[0]+".mp3"),m==="from"?exStart(e):0)}));
}

let qs=null;
function startQuiz(l){
  const items=l.quiz.map(q=>({...q,order:shuffle(q.o.map((_,k)=>k))}));
  qs={l,items,n:0,score:0,answered:false}; renderQ();
}
function startReview(){
  const all=LESSONS.flatMap(l=>l.quiz.map(q=>({...q,from:l.title})));
  startQuiz({id:"review",title:"Итоговый тест",quiz:shuffle(all).slice(0,15),review:true});
}
function renderQ(){
  const {l,items,n}=qs;
  if(n>=items.length) return result();
  const q=items[n];
  app.innerHTML=`<div class="topbar"><a class="back" href="${l.review?"#":"#"+l.id}">‹ ${l.review?"Темы":"Урок"}</a><span class="mid">${l.review?"Итоговый тест":"Тест: "+t(l.title)}</span><span></span></div>
  <div class="q-meta"><span>Вопрос ${n+1} из ${items.length}</span><span>Верно: ${qs.score}</span></div>
  <div class="bar"><i style="width:${n/items.length*100}%"></i></div>
  ${q.from?`<div class="q-from">${t(q.from)}</div>`:""}
  <p class="q-text">${t(q.q)}</p>${q.ar?`<div class="q-ar ar">${t(q.ar)}</div>`:""}
  <div class="opts">${q.order.map(k=>`<button class="opt" id="opt-${k}" data-k="${k}">${q.ar_opts?`<span class="ar">${t(q.o[k])}</span>`:t(q.o[k])}</button>`).join("")}</div>
  <div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  window.scrollTo(0,0);
}
function answer(k){
  if(qs.answered) return; qs.answered=true;
  const q=qs.items[qs.n], ok=k===q.a; if(ok) qs.score++;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===q.a)b.classList.add("ok");else if(kk===k)b.classList.add("no")});
  document.getElementById("fb").innerHTML=`<div class="explain"><b>${ok?"Верно.":"Неверно."}</b> ${t(q.e)}</div>
  <div class="lesson-foot"><button class="btn" id="next-q">${qs.n+1<qs.items.length?"Дальше":"Результат"}</button></div>`;
  const nb=document.getElementById("next-q"); nb.focus();
  nb.addEventListener("click",()=>{qs.n++;qs.answered=false;renderQ()});
}
function result(){
  const {l,items,score}=qs, pct=Math.round(score/items.length*100);
  const pk=l.review?"__review":l.id;
  progress[pk]=Math.max(progress[pk]||0,pct); save();
  const i=LESSONS.indexOf(l), next=l.review?null:LESSONS[i+1], pass=pct>=80;
  let actions;
  if(l.review) actions=`<a class="btn" href="#">К темам</a>`;
  else actions=pass&&next?`<a class="btn" href="#${next.id}">Следующий урок ›</a>`:`<a class="btn" href="#${l.id}">Открыть урок</a>`;
  app.innerHTML=`<div class="topbar"><a class="back" href="#">‹ Темы</a><span class="mid">${t(l.title)}</span><span></span></div>
  <div class="result"><span class="big">${pct}%</span><h2>${l.review?(pass?"Отличный результат":"Есть что повторить"):(pass?"Тема пройдена":"Повторите урок")}</h2>
  <p class="lead">${score} из ${items.length} верно. ${pass?"":"Для зачёта нужно 80% и выше."}</p>
  <div class="lesson-foot" style="width:100%">${actions}<button class="btn ghost" id="retry">Пройти ещё раз</button></div></div>`;
  document.getElementById("retry").addEventListener("click",()=>l.review?startReview():startQuiz(l));
}

function route(){
  stopAudio();
  const h=location.hash.slice(1);
  if(h==="review") return startReview();
  if(h.endsWith("-test")){const l=LESSONS.find(x=>x.id===h.slice(0,-5)); if(l) return startQuiz(l);}
  const l=LESSONS.find(x=>x.id===h); if(l) return lesson(l);
  home();
}
addEventListener("hashchange",route); route();
</script>
</body>
</html>
